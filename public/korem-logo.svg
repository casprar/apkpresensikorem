<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" fill="#000000" rx="0"/>
  
  <g transform="translate(0, -10)">
    <!-- 8 People Figures Ring -->
    <!-- 1. Top - Purple -->
    <g transform="rotate(0 250 210)">
      <circle cx="250" cy="80" r="24" fill="#8E24AA" />
      <path d="M 226 100 Q 250 115 274 100 L 278 175 Q 250 185 222 175 Z" fill="#8E24AA" />
    </g>

    <!-- 2. Top Right - Orange -->
    <g transform="rotate(45 250 210)">
      <circle cx="250" cy="80" r="24" fill="#FB8C00" />
      <path d="M 226 100 Q 250 115 274 100 L 278 175 Q 250 185 222 175 Z" fill="#FB8C00" />
    </g>

    <!-- 3. Right - Green -->
    <g transform="rotate(90 250 210)">
      <circle cx="250" cy="80" r="24" fill="#7CB342" />
      <path d="M 226 100 Q 250 115 274 100 L 278 175 Q 250 185 222 175 Z" fill="#7CB342" />
    </g>

    <!-- 4. Bottom Right - Blue -->
    <g transform="rotate(135 250 210)">
      <circle cx="250" cy="80" r="24" fill="#29B6F6" />
      <path d="M 226 100 Q 250 115 274 100 L 278 175 Q 250 185 222 175 Z" fill="#29B6F6" />
    </g>

    <!-- 5. Bottom - Teal -->
    <g transform="rotate(180 250 210)">
      <circle cx="250" cy="80" r="24" fill="#26A69A" />
      <path d="M 226 100 Q 250 115 274 100 L 278 175 Q 250 185 222 175 Z" fill="#26A69A" />
    </g>

    <!-- 6. Bottom Left - Magenta -->
    <g transform="rotate(225 250 210)">
      <circle cx="250" cy="80" r="24" fill="#E91E63" />
      <path d="M 226 100 Q 250 115 274 100 L 278 175 Q 250 185 222 175 Z" fill="#E91E63" />
    </g>

    <!-- 7. Left - Yellow -->
    <g transform="rotate(270 250 210)">
      <circle cx="250" cy="80" r="24" fill="#FDD835" />
      <path d="M 226 100 Q 250 115 274 100 L 278 175 Q 250 185 222 175 Z" fill="#FDD835" />
    </g>

    <!-- 8. Top Left - Crimson -->
    <g transform="rotate(315 250 210)">
      <circle cx="250" cy="80" r="24" fill="#D81B60" />
      <path d="M 226 100 Q 250 115 274 100 L 278 175 Q 250 185 222 175 Z" fill="#D81B60" />
    </g>

    <!-- Black Dividers between figures -->
    <g stroke="#000000" stroke-width="6" stroke-linecap="round">
      <line x1="250" y1="210" x2="250" y2="70" transform="rotate(22.5 250 210)" />
      <line x1="250" y1="210" x2="250" y2="70" transform="rotate(67.5 250 210)" />
      <line x1="250" y1="210" x2="250" y2="70" transform="rotate(112.5 250 210)" />
      <line x1="250" y1="210" x2="250" y2="70" transform="rotate(157.5 250 210)" />
      <line x1="250" y1="210" x2="250" y2="70" transform="rotate(202.5 250 210)" />
      <line x1="250" y1="210" x2="250" y2="70" transform="rotate(247.5 250 210)" />
      <line x1="250" y1="210" x2="250" y2="70" transform="rotate(292.5 250 210)" />
      <line x1="250" y1="210" x2="250" y2="70" transform="rotate(337.5 250 210)" />
    </g>

    <!-- Center Black Cutout Circle -->
    <circle cx="250" cy="210" r="72" fill="#000000" />

    <!-- Center White Graphic: Cross & Equalizer Bars -->
    <!-- Center Vertical Cross Stem -->
    <rect x="238" y="100" width="24" height="240" rx="12" fill="#FFFFFF" />
    <!-- Horizontal Cross Beam -->
    <rect x="180" y="145" width="140" height="24" rx="12" fill="#FFFFFF" />

    <!-- Equalizer Pillar 1 (Left Outer) -->
    <rect x="168" y="210" width="20" height="85" rx="10" fill="#FFFFFF" />
    <!-- Equalizer Pillar 2 (Left Inner) -->
    <rect x="203" y="180" width="20" height="135" rx="10" fill="#FFFFFF" />

    <!-- Equalizer Pillar 3 (Right Inner) -->
    <rect x="277" y="180" width="20" height="135" rx="10" fill="#FFFFFF" />
    <!-- Equalizer Pillar 4 (Right Outer) -->
    <rect x="312" y="210" width="20" height="85" rx="10" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <text x="250" y="420" text-anchor="middle" fill="#FFFFFF" font-family="'Arial Black', 'Impact', sans-serif" font-size="44" font-weight="900" letter-spacing="7">KOREM</text>
  <text x="250" y="452" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', 'Arial', sans-serif" font-size="17" font-weight="800" letter-spacing="10">G K I   P A M U L A N G</text>
</svg>
